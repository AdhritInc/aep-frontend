name: Frontend-CI-CD

on:
  pull_request:
    branches:
      - main
      - develop

  push:
    branches:
      - main
      - feature/*

permissions:
  id-token: write
  contents: read

concurrency:
  group: frontend-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  IMAGE_NAME: aep-frontend

jobs:
  frontend-ci:
    name: Frontend CI
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      ####################################################
      # Checkout
      ####################################################
      - name: Checkout Repository
        uses: actions/checkout@v6

      ####################################################
      # Setup Node
      ####################################################
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: package-lock.json

      ####################################################
      # Install Dependencies
      ####################################################
      - name: Install Dependencies
        run: npm ci

      ####################################################
      # ESLint
      ####################################################
      - name: Set Current Stage
        run: echo "CURRENT_STAGE=ESLint" >> $GITHUB_ENV

      - name: Run ESLint
        run: npm run lint

      ####################################################
      # Type Check
      ####################################################
      - name: Set Current Stage
        run: echo "CURRENT_STAGE=Type Check" >> $GITHUB_ENV

      - name: Run Type Check
        run: npm run type-check

      ####################################################
      # Unit Tests
      ####################################################
      - name: Set Current Stage
        run: echo "CURRENT_STAGE=Unit Tests" >> $GITHUB_ENV

      - name: Run Unit Tests with Coverage
        run: npm run coverage

      ####################################################
      # Docker Buildx
      ####################################################
      - name: Set Current Stage
        run: echo "CURRENT_STAGE=Setup Docker Buildx" >> $GITHUB_ENV

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      ####################################################
      # Docker Build
      ####################################################
      - name: Set Current Stage
        run: echo "CURRENT_STAGE=Build Docker Image" >> $GITHUB_ENV

      - name: Build Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: false
          load: true
          tags: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.title=${{ env.IMAGE_NAME }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      ####################################################
      # Generate Image SBOM
      ####################################################
      - name: Set Current Stage
        run: echo "CURRENT_STAGE=Generate Image SBOM" >> $GITHUB_ENV

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@v0

      - name: Generate Image SBOM
        run: |
          syft ${{ env.IMAGE_NAME }}:${{ github.sha }} \
            -o cyclonedx-json=sbom.json

      ####################################################
      # Archive SBOM
      ####################################################
      - name: Archive SBOM
        uses: actions/upload-artifact@v4
        with:
          name: image-sbom
          path: sbom.json
          retention-days: 14

      ####################################################
      # Trivy Image Scan
      ####################################################
      - name: Set Current Stage
        run: echo "CURRENT_STAGE=Trivy Image Scan" >> $GITHUB_ENV

      - name: Scan Docker Image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: ${{ env.IMAGE_NAME }}:${{ github.sha }}
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      ####################################################
      # Configure AWS Credentials
      ####################################################
      - name: Set Current Stage
        if: github.event_name == 'push' && success()
        run: echo "CURRENT_STAGE=Configure AWS Credentials" >> $GITHUB_ENV

      - name: Configure AWS Credentials
        if: github.event_name == 'push' && success()
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS Authentication
        if: github.event_name == 'push' && success()
        run: aws sts get-caller-identity

      ####################################################
      # Login to Amazon ECR
      ####################################################
      - name: Set Current Stage
        if: github.event_name == 'push' && success()
        run: echo "CURRENT_STAGE=Login to Amazon ECR" >> $GITHUB_ENV

      - name: Login to Amazon ECR
        if: github.event_name == 'push' && success()
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      ####################################################
      # Tag Docker Image
      ####################################################
      - name: Set Current Stage
        if: github.event_name == 'push' && success()
        run: echo "CURRENT_STAGE=Tag Docker Image" >> $GITHUB_ENV

      - name: Tag Docker Image
        if: github.event_name == 'push' && success()
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          docker tag ${IMAGE_NAME}:${IMAGE_TAG} ${REGISTRY}/${REPOSITORY}:latest

      ####################################################
      # Push Docker Image
      ####################################################
      - name: Set Current Stage
        if: github.event_name == 'push' && success()
        run: echo "CURRENT_STAGE=Push Docker Image to Amazon ECR" >> $GITHUB_ENV

      - name: Push Docker Image
        if: github.event_name == 'push' && success()
        env:
          IMAGE_NAME: ${{ env.IMAGE_NAME }}
          REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          REPOSITORY: ${{ vars.ECR_REPOSITORY }}
          IMAGE_TAG: ${{ github.sha }}
        run: |
          docker push ${REGISTRY}/${REPOSITORY}:${IMAGE_TAG}
          docker push ${REGISTRY}/${REPOSITORY}:latest

      ####################################################
      # Render ECS Task Definition
      ####################################################
      - name: Set Current Stage
        if: success()
        run: echo "CURRENT_STAGE=Render ECS Task Definition" >> $GITHUB_ENV

      - name: Render ECS Task Definition
        if: success()
        id: render-task-definition
        uses: aws-actions/amazon-ecs-render-task-definition@v1
        with:
          task-definition: .github/ecs/task-definition.json
          container-name: ${{ vars.ECS_CONTAINER_NAME }}
          image: ${{ steps.login-ecr.outputs.registry }}/${{ vars.ECR_REPOSITORY }}:${{ github.sha }}

      ####################################################
      # Deploy to Amazon ECS
      ####################################################
      - name: Set Current Stage
        if: success()
        run: echo "CURRENT_STAGE=Deploy to Amazon ECS" >> $GITHUB_ENV

      - name: Deploy to Amazon ECS
        if: success()
        uses: aws-actions/amazon-ecs-deploy-task-definition@v2
        with:
          task-definition: ${{ steps.render-task-definition.outputs.task-definition }}
          service: ${{ vars.ECS_SERVICE }}
          cluster: ${{ vars.ECS_CLUSTER }}
          wait-for-service-stability: true  

      ####################################################
      # Slack Notification
      ####################################################
      - name: Notify Slack
        if: always()
        uses: slackapi/slack-github-action@v2.1.1
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL }}
          webhook-type: incoming-webhook
          payload: |
            text: |
              🚀 *Frontend CI Pipeline*

              *Repository:* ${{ github.repository }}
              *Branch:* ${{ github.ref_name }}
              *Status:* ${{ job.status }}
              *Last Stage:* ${{ env.CURRENT_STAGE }}
              *Commit:* ${{ github.sha }}

              *Run:* ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}